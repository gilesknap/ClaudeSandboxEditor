[project]
name = "md-collab-editor"
dynamic = ["version"]
description = "Local GitHub-style markdown editor shared between you and Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gareth Nisbet" }]
keywords = ["markdown", "editor", "claude", "claude-code", "gfm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.scripts]
md-editor = "md_collab_editor.server:main"

[project.urls]
Repository = "https://github.com/garethnisbet/MDCollaborativeEditor"
Issues = "https://github.com/garethnisbet/MDCollaborativeEditor/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    # its Chromium build matches the Node Playwright 1.63 in claude-sandbox; it needs Python 3.10+,
    # so on 3.9 the browser tests are skipped
    "playwright==1.63.0; python_version >= '3.10'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: drives the editor in headless Chromium (Playwright); skipped when no browser is installed"]

[tool.hatch.version]
path = "src/md_collab_editor/__init__.py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
